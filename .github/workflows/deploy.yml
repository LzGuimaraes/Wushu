name: Deploy API

on:
  push:
    branches: [main]
  # Para disparo manual (botão "Run workflow"):
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lzguimaraes/wushu-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "==> [1/4] Escrevendo /opt/wushu/api.env"
            mkdir -p /opt/wushu

            cat > /opt/wushu/api.env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            APP_URL=${{ secrets.APP_URL }}
            EOF

            echo "==> [2/4] Baixando a imagem"
            docker pull ${{ env.IMAGE }}:latest

            echo "==> [3/4] Recriando o container api"
            docker rm -f api || true
            docker run -d --name api \
              --network kungfu-net \
              --restart unless-stopped \
              --env-file /opt/wushu/api.env \
              -l 'traefik.enable=true' \
              -l 'traefik.http.routers.api.rule=Host(`${{ vars.DOMAIN_API }}`)' \
              -l 'traefik.http.routers.api.entrypoints=${{ vars.TRAEFIK_ENTRYPOINT }}' \
              -l 'traefik.http.routers.api.tls.certresolver=${{ vars.TRAEFIK_CERTRESOLVER }}' \
              -l 'traefik.http.services.api.loadbalancer.server.port=3000' \
              -l 'traefik.http.services.api.loadbalancer.healthcheck.path=/health' \
              -l 'traefik.http.services.api.loadbalancer.healthcheck.interval=30s' \
              ${{ env.IMAGE }}:latest

            echo "==> [4/4] Status do container"
            sleep 5
            docker ps --filter name=api --format 'table {{.Names}}\t{{.Status}}'
            echo "--- Logs recentes da API ---"
            docker logs api --tail 25 || true
